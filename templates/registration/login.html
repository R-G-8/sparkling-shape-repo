{% extends "base.html" %}
{% block title %}Log in · numbawatchd{% endblock %}
{% block content %}
<article>
  <h1>Log in</h1>
  {% if form.errors %}<p role="alert">Your username and password didn't match. Please try again.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Username {{ form.username }}</label>
    <label>Password {{ form.password }}</label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p>New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
</article>
{% endblock %}
